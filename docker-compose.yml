services:
  # build-image: 仅构建并打标记基础镜像
  build-image:
    build:
      context: .
      dockerfile: Dockerfile
    image: nju-fuzzer:latest
    container_name: nju-fuzzer-build-image
    # 只需要能访问到一组只读文件以完成构建输出复制
    volumes:
      - ./one_click.sh:/workspace/one_click.sh:ro
      - ./target:/workspace/target:ro
      - ./pom.xml:/workspace/pom.xml:ro
      - ./src:/workspace/src:ro
    working_dir: /workspace
    # 构建完成后立即退出（不会长期运行）
    command: ["sh", "-c", "echo build done && exit 0"]

  # c++filt fuzzing
  fuzzer-cppfilt:
    image: nju-fuzzer:latest
    container_name: nju-fuzzer-cppfilt
    depends_on:
      - build-image
    volumes:
      - ./workdir/c++filt:/workspace/workdir/c++filt
      - ./one_click.sh:/workspace/one_click.sh:ro
      - ./target:/workspace/target:ro
      - ./pom.xml:/workspace/pom.xml:ro
      - ./src:/workspace/src:ro
    working_dir: /workspace
    command: ["bash", "/workspace/one_click.sh", "c++filt"]

  # readelf fuzzing
  fuzzer-readelf:
    image: nju-fuzzer:latest
    container_name: nju-fuzzer-readelf
    depends_on:
      - build-image
    volumes:
      - ./workdir/readelf:/workspace/workdir/readelf
      - ./one_click.sh:/workspace/one_click.sh:ro
      - ./target:/workspace/target:ro
      - ./pom.xml:/workspace/pom.xml:ro
      - ./src:/workspace/src:ro
    working_dir: /workspace
    command: ["bash", "/workspace/one_click.sh", "readelf"]

  # nm fuzzing
  fuzzer-nm:
    image: nju-fuzzer:latest
    container_name: nju-fuzzer-nm
    depends_on:
      - build-image
    volumes:
      - ./workdir/nm:/workspace/workdir/nm
      - ./one_click.sh:/workspace/one_click.sh:ro
      - ./target:/workspace/target:ro
      - ./pom.xml:/workspace/pom.xml:ro
      - ./src:/workspace/src:ro
    working_dir: /workspace
    command: ["bash", "/workspace/one_click.sh", "nm"]

  # objdump fuzzing
  fuzzer-objdump:
    image: nju-fuzzer:latest
    container_name: nju-fuzzer-objdump
    depends_on:
      - build-image
    volumes:
      - ./workdir/objdump:/workspace/workdir/objdump
      - ./one_click.sh:/workspace/one_click.sh:ro
      - ./target:/workspace/target:ro
      - ./pom.xml:/workspace/pom.xml:ro
      - ./src:/workspace/src:ro
    working_dir: /workspace
    command: ["bash", "/workspace/one_click.sh", "objdump"]

  # djpeg fuzzing
