      - ./src:/workspace/src:ro
    working_dir: /workspace
    command: ["bash", "/workspace/one_click.sh", "djpeg"]

  # readpng fuzzing
  fuzzer-readpng:
    image: nju-fuzzer:latest
    container_name: nju-fuzzer-readpng
