      - ./one_click.sh:/workspace/one_click.sh:ro
      - ./target:/workspace/target:ro
      - ./pom.xml:/workspace/pom.xml:ro
      - ./src:/workspace/src:ro
    working_dir: /workspace
    command: ["bash", "/workspace/one_click.sh", "lua"]

  # mjs fuzzing
  fuzzer-mjs:
    image: nju-fuzzer:latest
