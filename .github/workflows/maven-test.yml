name: Maven Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run env script and tests
        shell: bash
        run: |
          sudo ./env/env.sh
          mvn -B test