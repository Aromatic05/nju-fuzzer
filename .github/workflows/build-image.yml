name: Build toolchain image
on:
  workflow_dispatch:
  push:
    tags:
      - "toolchain-v*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/aromatic05/nju-fuzzer:toolchain-${{ github.ref_name }}
            ghcr.io/aromatic05/nju-fuzzer:latest

